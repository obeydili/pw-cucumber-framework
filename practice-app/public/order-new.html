<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New order · Trade Desk Lite</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="order-new">
  <header class="topbar">
    <a class="brand" href="/orders">Trade Desk Lite</a>
    <nav aria-label="Main">
      <a href="/orders">Orders</a>
      <a href="/orders/new" data-role="trader">New order</a>
      <a href="/approvals" data-role="approver">Approvals</a>
    </nav>
    <div class="user">
      <span id="current-user" data-testid="current-user"></span>
      <button type="button" id="sign-out" class="link">Sign out</button>
    </div>
  </header>
  <main class="card narrow">
    <h1>Order ticket</h1>
    <form id="order-form" novalidate>
      <label for="symbol">Symbol</label>
      <select id="symbol" name="symbol" required>
        <option value="">Choose a symbol</option>
      </select>
      <fieldset>
        <legend>Side</legend>
        <label class="inline"><input type="radio" name="side" value="Buy"> Buy</label>
        <label class="inline"><input type="radio" name="side" value="Sell"> Sell</label>
      </fieldset>
      <label for="quantity">Quantity</label>
      <input id="quantity" name="quantity" type="number" min="1" step="1" inputmode="numeric" aria-describedby="quantity-help" required>
      <p id="quantity-help" class="help">Whole shares, 1 to 1,000,000.</p>
      <label for="limitPrice">Limit price</label>
      <input id="limitPrice" name="limitPrice" type="number" min="0.01" step="0.01" inputmode="decimal" aria-describedby="price-help" required>
      <p id="price-help" class="help">Greater than 0, at most 2 decimals.</p>
      <p id="order-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" id="submit-order" disabled>Submit order</button>
        <a href="/orders">Cancel</a>
      </div>
    </form>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
