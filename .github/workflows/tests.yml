name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Framework
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          cd practice-app && npm install
          cd ..
          npm ci
          npx playwright install chromium --with-deps

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      # Only the URL goes into the env file; the password stays in the secret below.
      - name: Create QA Env File
        run: |
          echo "BASE_URL=http://localhost:3200" > env/.env.qa

      - name: Start Practice App
        run: |
          cd practice-app
          npm run start:qa &
          npx --yes wait-on http://localhost:3200

      - name: Run Smoke Suite
        env:
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        run: |
          make test ENV=qa TAGS=@smoke

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          retention-days: 7
